name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  ICS_TAG: v0.7.53   # ics-openvpn release tag; change here if the build asks for another

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install swig (needed by ics-openvpn native build)
        run: sudo apt-get update && sudo apt-get install -y swig

      - name: Fetch ics-openvpn engine
        run: |
          git clone --branch "$ICS_TAG" https://github.com/schwabe/ics-openvpn.git ics-openvpn
          cd ics-openvpn && git submodule update --init --recursive

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.4"

      - name: Build debug APK (armeabi-v7a)
        run: gradle :app:assembleDebug --no-daemon --stacktrace -Pandroid.injected.build.abi=armeabi-v7a

      - uses: actions/upload-artifact@v4
        with:
          name: VpnGateTV-apk
          path: app/build/outputs/apk/debug/*.apk
