name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  ICS_TAG: v0.7.53   # ics-openvpn release tag

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Free disk space (native builds are big)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install swig
        run: sudo apt-get update && sudo apt-get install -y swig

      - name: Fetch ics-openvpn (the engine AND the app we extend)
        run: |
          git clone --branch "$ICS_TAG" https://github.com/schwabe/ics-openvpn.git ics-openvpn
          cd ics-openvpn && git submodule update --init --recursive

      - name: Inject VPN Gate TV screen into ics-openvpn app
        run: |
          M=ics-openvpn/main
          mkdir -p $M/src/main/java $M/src/main/res
          cp -r inject/java/. $M/src/main/java/
          cp -r inject/res/. $M/src/main/res/
          python3 - <<'PY'
          p = 'ics-openvpn/main/src/main/AndroidManifest.xml'
          s = open(p).read()
          act = open('inject/activity.xml').read()
          assert '</application>' in s
          s = s.replace('</application>', act + '\n    </application>', 1)
          import re
          m = re.search(r'<application\b[^>]*>', s, re.S)
          tag = m.group(0)
          nm = re.search(r'android:name="([^"]+)"', tag)
          base = 'android.app.Application'
          if nm:
              base = nm.group(1)
              if base.startswith('.'):
                  base = 'de.blinkt.openvpn' + base
              newtag = tag.replace(nm.group(0), 'android:name="com.iconewegoo.vpngate.CrashApp"', 1)
          else:
              newtag = tag.replace('<application', '<application android:name="com.iconewegoo.vpngate.CrashApp"', 1)
          s = s.replace(tag, newtag, 1)
          print('Application base class:', base)
          open('ics-openvpn/main/src/main/java/com/iconewegoo/vpngate/CrashApp.kt', 'w').write(
              'package com.iconewegoo.vpngate\n\nclass CrashApp : ' + base + '() {\n'
              '    override fun onCreate() {\n        CrashLog.install(this)\n        super.onCreate()\n    }\n}\n')
          if 'usesCleartextTraffic' not in s:
              s = s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          open(p, 'w').write(s)
          PY
          f=$(ls $M/build.gradle.kts $M/build.gradle 2>/dev/null | head -1)
          if [[ "$f" == *.kts ]]; then
            printf '\ndependencies {\n    implementation("androidx.appcompat:appcompat:1.6.1")\n    implementation("androidx.recyclerview:recyclerview:1.3.2")\n}\n' >> "$f"
            # extract native libs at install: OpenVPN 2 executes libovpnexec.so from nativeLibraryDir
            printf '\nandroid {\n    packaging {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }\n}\n' >> "$f"
          else
            printf "\ndependencies {\n    implementation 'androidx.appcompat:appcompat:1.6.1'\n    implementation 'androidx.recyclerview:recyclerview:1.3.2'\n}\n" >> "$f"
            printf "\nandroid {\n    packaging {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }\n}\n" >> "$f"
          fi
          echo "--- flavor info ---"
          grep -n -i "flavorDimensions\|productFlavors\|ovpn\|create(\"" "$f" | head -20 || true

      - name: Build debug APK
        run: |
          set -o pipefail
          cd ics-openvpn
          chmod +x gradlew
          touch gradle.properties
          sed -i '/^org.gradle.jvmargs/d;/^kotlin.daemon.jvmargs/d' gradle.properties
          printf 'org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\nkotlin.daemon.jvmargs=-Xmx2g\n' >> gradle.properties
          free -g | head -2
          echo "=== pass 1: builds the native code (creates main/build/ovpnassets) ==="
          ./gradlew assembleUiOvpn2Debug --no-daemon -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=1g" > ../build_pass1.log 2>&1 || true
          tail -5 ../build_pass1.log
          echo "=== OpenVPN executables produced for assets ==="
          ls -la main/build/ovpnassets || echo "NO ovpnassets DIR"
          echo "=== pass 2: packages them into the APK ==="
          ./gradlew assembleUiOvpn2Debug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=1g" 2>&1 | tee ../build.log

      - name: Show the real error (only if build failed)
        if: failure()
        run: |
          echo "=================== ERROR SUMMARY ==================="
          grep -n -A 14 "What went wrong" build.log | head -40 || true
          echo "----------------- root causes -----------------"
          grep -n "Caused by" build.log | head -15 || true
          df -h / || true
          echo "----------------- kotlin / aapt / manifest errors -----------------"
          grep -n -i "^e: \|error:\|aapt\|Manifest merger\|not found" build.log | head -40 || true

      - name: Upload full build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Find OpenVPN executables in build tree
        if: always()
        run: |
          find ics-openvpn -type f \( -name "*pie_openvpn*" -o -name "libovpnexec*" -o -name "libopenvpn*" -o -name "minivpn*" \) -not -path "*/src/main/cpp/*" | head -40
          echo "--- assets dirs ---"
          find ics-openvpn/main/build -type d -name assets | head
          find ics-openvpn/main/build -path "*assets*" -type f | head -40

      - name: Inspect APK contents
        if: always()
        run: |
          for a in $(find ics-openvpn -name "*.apk"); do
            echo "== $a"; ls -la "$a"
            unzip -l "$a" | grep -i -E "openvpn|ovpn|minivpn|assets/|\.so$" | head -60
          done

      - name: List APKs
        if: always()
        run: |
          echo "--- build result ---"
          grep -n "BUILD \|packageUi\|assembleUi" build.log | tail -8 || true
          echo "--- apk files ---"
          find ics-openvpn -type f \( -name "*.apk" -o -name "*.aab" \) -print
          echo "--- outputs tree ---"
          ls -R ics-openvpn/main/build/outputs 2>/dev/null | head -40 || true

      - uses: actions/upload-artifact@v4
        with:
          name: VpnGateTV-apk
          path: ics-openvpn/**/*.apk
          if-no-files-found: error
