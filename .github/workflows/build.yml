name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  ICS_TAG: v0.7.53   # ics-openvpn release tag; change here if the build asks for another

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install swig (needed by ics-openvpn native build)
        run: sudo apt-get update && sudo apt-get install -y swig

      - name: Fetch ics-openvpn engine
        run: |
          git clone --branch "$ICS_TAG" https://github.com/schwabe/ics-openvpn.git ics-openvpn
          cd ics-openvpn && git submodule update --init --recursive

      - name: Align plugin versions and Gradle version with ics-openvpn
        id: align
        run: |
          python3 - <<'PY'
          import tomllib
          d = tomllib.load(open('ics-openvpn/gradle/libs.versions.toml', 'rb'))
          vers = d.get('versions', {})
          found = {}
          for k, v in d.get('plugins', {}).items():
              if isinstance(v, str):
                  pid, _, ver = v.partition(':')
              else:
                  pid, ver = v.get('id'), v.get('version')
                  if isinstance(ver, dict):
                      ver = vers.get(ver.get('ref')) if 'ref' in ver else ver.get('require')
              if pid and ver:
                  found[pid] = ver
          fallback = {'com.android.application': '8.2.2', 'com.android.library': '8.2.2',
                      'org.jetbrains.kotlin.android': '1.9.22'}
          agp = found.get('com.android.application') or found.get('com.android.library') or '8.2.2'
          lines = ["plugins {"]
          for pid in fallback:
              ver = found.get(pid) or (agp if pid.startswith('com.android') else fallback[pid])
              lines.append(f"    id '{pid}' version '{ver}' apply false")
          lines.append("}")
          open('build.gradle', 'w').write("\n".join(lines) + "\n")
          print(open('build.gradle').read())
          PY
          v=$(grep distributionUrl ics-openvpn/gradle/wrapper/gradle-wrapper.properties | sed -E 's/.*gradle-([0-9.]+)-.*/\1/' || true)
          # second flavor dimension of ics-openvpn (ovpn2 = lighter engine build)
          grep -q ovpnimpl app/build.gradle || sed -i "s/missingDimensionStrategy 'implementation', 'skeleton'/&\n        missingDimensionStrategy 'ovpnimpl', 'ovpn2'/" app/build.gradle
          echo "--- ics flavor dimensions ---"
          grep -n -i "flavorDimensions\|productFlavors\|ovpn" ics-openvpn/main/build.gradle* | head -20 || true
          printf 'org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\nandroid.suppressUnsupportedCompileSdk=35\n' > gradle.properties
          sed -i "s/compileSdk 34/compileSdk 35/" app/build.gradle
          echo "gradle=${v:-8.4}" >> "$GITHUB_OUTPUT"
          echo "Using Gradle ${v:-8.4}"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: ${{ steps.align.outputs.gradle }}

      - name: Build debug APK (armeabi-v7a)
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon -Pandroid.injected.build.abi=armeabi-v7a 2>&1 | tee build.log

      - name: Show the real error (only if build failed)
        if: failure()
        run: |
          echo "=================== ERROR SUMMARY ==================="
          grep -n -A 25 "What went wrong" build.log | head -80 || true
          echo "----------------- other error lines -----------------"
          grep -n "error:\|Could not\|Unresolved\|FAILED" build.log | head -30 || true

      - uses: actions/upload-artifact@v4
        with:
          name: VpnGateTV-apk
          path: app/build/outputs/apk/debug/*.apk
